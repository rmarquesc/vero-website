<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" fill="none">
  <defs>
    <linearGradient id="network" x1="120" y1="140" x2="640" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B7BFF"/>
      <stop offset=".48" stop-color="#33E6E3"/>
      <stop offset="1" stop-color="#FF6FD8"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9B7BFF" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#33E6E3" stop-opacity=".11"/>
      <stop offset="1" stop-color="#FF6FD8" stop-opacity=".13"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#33E6E3" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#8B5CFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#05060A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <ellipse cx="380" cy="460" rx="240" ry="280" fill="url(#halo)" filter="url(#blur)"/>

  <!-- connections -->
  <g stroke="url(#network)" stroke-width="1" opacity=".55">
    <path d="M190 200 330 320"/>
    <path d="M330 320 480 320"/>
    <path d="M480 320 480 480"/>
    <path d="M480 480 330 600"/>
    <path d="M330 600 190 740"/>
    <path d="M480 480 620 600"/>
    <path d="M190 200 190 360"/>
    <path d="M190 360 330 320"/>
  </g>

  <!-- nodes -->
  <g fill="#05060A" stroke="#9B7BFF" stroke-width="1.2">
    <circle cx="190" cy="200" r="4"/>
    <circle cx="190" cy="360" r="3.5"/>
    <circle cx="620" cy="600" r="4"/>
  </g>
  <g fill="#05060A" stroke="#33E6E3" stroke-width="1.2">
    <circle cx="330" cy="320" r="5"/>
    <circle cx="480" cy="320" r="4"/>
    <circle cx="480" cy="480" r="5"/>
    <circle cx="330" cy="600" r="4"/>
    <circle cx="190" cy="740" r="5"/>
  </g>

  <!-- boxes -->
  <g font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.1">
    <g>
      <rect x="136" y="170" width="108" height="52" fill="#070912" fill-opacity=".72" stroke="#9B7BFF" stroke-opacity=".65"/>
      <text x="152" y="192" fill="#B7A7FF">SOURCE</text>
      <text x="152" y="209" fill="#626A80" font-size="9">PUBLIC / PSEUDO</text>
    </g>
    <g>
      <rect x="136" y="332" width="108" height="52" fill="#070912" fill-opacity=".68" stroke="#8D84C9" stroke-opacity=".55"/>
      <text x="152" y="354" fill="#AFA3CF">CREDENTIAL</text>
      <text x="152" y="371" fill="#626A80" font-size="9">PRIVATE</text>
    </g>
    <g>
      <rect x="276" y="288" width="108" height="60" fill="url(#soft)" stroke="#33E6E3" stroke-opacity=".9"/>
      <text x="294" y="314" fill="#71F5F2">ZK PROOF</text>
      <text x="294" y="332" fill="#A5AFBF" font-size="9">CONDITIONS MET</text>
    </g>
    <g>
      <rect x="428" y="288" width="116" height="60" fill="#070912" fill-opacity=".7" stroke="#33E6E3" stroke-opacity=".6"/>
      <text x="444" y="314" fill="#86F2EF">DISCLOSURE</text>
      <text x="444" y="332" fill="#626A80" font-size="9">SOURCE CHOOSES</text>
    </g>
    <g>
      <rect x="428" y="448" width="108" height="60" fill="url(#soft)" stroke="#33E6E3" stroke-opacity=".88"/>
      <text x="446" y="474" fill="#82F4F1">VERIFIED</text>
      <text x="446" y="492" fill="#9EA7B9" font-size="9">SIGNAL / PUBLIC</text>
    </g>
    <g>
      <rect x="276" y="568" width="108" height="52" fill="#070912" fill-opacity=".68" stroke="#33E6E3" stroke-opacity=".5"/>
      <text x="292" y="590" fill="#79DFDC">IDENTITY</text>
      <text x="292" y="607" fill="#626A80" font-size="9">OPTIONAL</text>
    </g>
    <g>
      <rect x="136" y="710" width="108" height="52" fill="#070912" fill-opacity=".72" stroke="#33E6E3" stroke-opacity=".65"/>
      <text x="152" y="732" fill="#76EBE8">CREDIBILITY</text>
      <text x="152" y="749" fill="#626A80" font-size="9">PROVABLE</text>
    </g>
    <g>
      <rect x="568" y="572" width="100" height="52" fill="#070912" fill-opacity=".68" stroke="#8F76D9" stroke-opacity=".5"/>
      <text x="582" y="594" fill="#B7A8EA">READER</text>
      <text x="582" y="611" fill="#626A80" font-size="9">TRUST SIGNAL</text>
    </g>
  </g>

  <!-- coordinate annotations -->
  <g font-family="IBM Plex Mono, monospace" fill="#555E72" font-size="9" letter-spacing="1">
    <text x="160" y="152">01 / SOURCE</text>
    <text x="428" y="270">02 / PROOF</text>
    <text x="160" y="690">03 / OUTPUT</text>
    <text x="380" y="860">VERO.NET</text>
  </g>

  <!-- glow on key nodes -->
  <g fill="#33E6E3" opacity=".7" filter="url(#glow)">
    <circle cx="330" cy="320" r="5"/>
    <circle cx="480" cy="480" r="5"/>
    <circle cx="190" cy="740" r="5"/>
  </g>
</svg>
